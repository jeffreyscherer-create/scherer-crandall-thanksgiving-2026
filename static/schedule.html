<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Schedule &mdash; Thanksgiving 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>📅 The Week</h1>
  <div class="subtitle">Family Announces Four-Day Itinerary, Declines To Explain Wednesday</div>
</header>
<nav class="tabs">
  <a href="index.html">Home</a>
  <a href="schedule.html" class="active">Schedule</a>
  <a href="teams.html">Teams</a>
  <a href="olympics.html">Olympics</a>
  <a href="scavenger.html">Hunt</a>
  <a href="admin.html">Judge</a>
</nav>
<main class="wrap" id="schedule-root">
  <p class="locked-note">Loading schedule...</p>
</main>
<footer class="legal">Schedule Subject To Change Pending Results Of Wayne's Turkey Experiment</footer>
<script src="js/app.js"></script>
<script>
function renderSchedule(schedule) {
  return schedule.map((day) => {
    const items = day.items.map((item) => `
      <div class="schedule-item ${item.highlight ? "highlight" : ""}">
        <div class="time">${item.time}</div>
        <div>
          <div class="title">${item.title}</div>
          ${item.detail ? `<div>${item.detail}</div>` : ""}
        </div>
      </div>
    `).join("");
    return `
      <div class="schedule-day">
        <h3>${day.day}</h3>
        <div class="card">${items}</div>
      </div>
    `;
  }).join("");
}

getState().then((state) => {
  document.getElementById("schedule-root").innerHTML = renderSchedule(state.schedule);
}).catch(() => {
  document.getElementById("schedule-root").innerHTML = "<p>Couldn't load the schedule. Try reloading.</p>";
});
</script>
</body>
</html>
